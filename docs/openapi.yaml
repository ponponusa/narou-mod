                  summary: colors がない・空・オブジェクトでない
                  value:
                    success: false
                    error:
                      code: INVALID_PARAMS
                      message: Colors hash is required
                    timestamp: 1731283200
                invalidJson:
                  summary: JSON 解析エラー
                  value:
                    success: false
                    error:
                      code: INVALID_JSON
                      message: "Invalid JSON: unexpected token"
                    timestamp: 1731283200
        '500':
          $ref: '#/components/responses/InternalError'

  # ========================================
