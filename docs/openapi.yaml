          $ref: '#/components/responses/InternalError'

    put:
      tags:
        - settings
      summary: 設定更新
      description: |
        指定された設定値を更新します。空文字または null を指定した設定は削除されます。
        指定されなかった設定は変更されません（PATCH と同じ動作です）。
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
