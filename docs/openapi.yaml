      operationId: patchSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/SettingsUpdated'
        '400':
