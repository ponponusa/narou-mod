  /api/v2/tags/color:
    post:
      tags:
        - tags
      summary: タグ色変更
      description: タグの表示色を変更します。
      operationId: changeTagColor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - colors
              properties:
                colors:
                  type: object
                  description: |
                    タグ名 → 色名 のマップ。色は `green`, `yellow`, `blue`, `magenta`, `cyan`, `red`, `white` のいずれか。
                    未知の色が指定されたエントリはエラーにならず黙って無視されますが、
                    レスポンスの `data.colors` にはリクエストの内容がそのまま返されます。
                  additionalProperties:
                    $ref: '#/components/schemas/TagColor'
                  example:
                    favorite: green
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          colors:
                            type: object
                            additionalProperties:
                              type: string
                            description: リクエストの `colors` をそのまま返します（無視された未知の色も含む）
              example:
                success: true
                data:
                  colors:
                    favorite: green
                message: Tag colors updated successfully
                timestamp: 1731283200
        '400':
          description: リクエストパラメータ不正（`colors` が空でないオブジェクトでない）、または JSON 解析エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
